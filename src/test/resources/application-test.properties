spring.datasource.url=${EC_TEST_DB_URL}
spring.datasource.username=${EC_TEST_DB_USER}
spring.datasource.password=${EC_TEST_DB_PASSWORD}
spring.flyway.url=${EC_TEST_DB_URL}
spring.flyway.user=${EC_TEST_DB_USER}
spring.flyway.password=${EC_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# PAY.JP test configuration
payjp.public-key=pk_test_dummy
payjp.secret-key=sk_test_dummy
payjp.api-base-url=http://127.0.0.1:1

payjp.webhook-token=wh_test_dummy

# Payment reconciliation
app.payment.reconciliation.enabled=false
app.payment.discrepancy-audit.enabled=false

app.payment.discrepancy-audit.notification.enabled=false

# Defense in depth; real gateway/mail beans are blocked by the test context guard.
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.org.flywaydb=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.jdbc=WARN
