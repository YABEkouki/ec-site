<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>お知らせ一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}">
    </header>

    <h1>お知らせ一覧</h1>

    <p th:if="${#lists.isEmpty(announcements)}">
        現在お知らせはありません。
    </p>

    <div th:unless="${#lists.isEmpty(announcements)}" class="announcement-list">

        <div th:each="announcement : ${announcements}" class="announcement-item">

            <div class="announcement-meta">
                <span class="announcement-importance"
                    th:classappend="' importance-' + ${#strings.toLowerCase(announcement.importance.name())}"
                    th:text="${announcement.importance.displayName}">
                </span>

                <span class="announcement-type" th:text="${announcement.type.displayName}">
                </span>

                <time th:text="${#temporals.format(
                    announcement.publishedAt,
                    'yyyy/MM/dd HH:mm')}">
                </time>
            </div>

            <a th:href="@{/announcements/{id}(id=${announcement.id})}" th:text="${announcement.title}"
                class="announcement-title">
            </a>

        </div>
    </div>

    <div th:if="${announcementPage.totalPages > 0}">

        <a th:if="${announcementPage.hasPrevious()}" th:href="@{/announcements(page=${announcementPage.number - 1})}"
            class="button button-secondary">
            前へ
        </a>

        <span th:each="pageNumber :
            ${#numbers.sequence(0, announcementPage.totalPages - 1)}">

            <span th:if="${pageNumber == announcementPage.number}" th:text="${pageNumber + 1}"
                class="button button-secondary">
            </span>

            <a th:unless="${pageNumber == announcementPage.number}" th:href="@{/announcements(page=${pageNumber})}"
                th:text="${pageNumber + 1}" class="button button-secondary">
            </a>

        </span>

        <a th:if="${announcementPage.hasNext()}" th:href="@{/announcements(page=${announcementPage.number + 1})}"
            class="button button-secondary">
            次へ
        </a>

    </div>

</body>

</html>
