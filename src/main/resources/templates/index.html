<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>EC Site</title>
</head>

<body>
    <h1>ECサイト</h1>

    <p>
        こんにちは、
        <span th:text="${username}">ユーザー</span>
        さん
    </p>

    <li sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/admin}">
            管理者メニュー
        </a>
    </li>

    <ul>
        <li><a th:href="@{/products}">商品一覧</a></li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/products/new}">
                商品登録
            </a>
        </li>
        <li>
            <a th:href="@{/orders}">注文履歴</a>
        </li>
                <li>
            <a th:href="@{/cart}">カートを見る</a>
        </li>
        <form th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </ul>
</body>

</html>
