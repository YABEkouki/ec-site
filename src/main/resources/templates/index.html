<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>EC Site</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}">
    </header>

    <h1>ECサイト</h1>

    <section class="announcement-section">
        <div class="announcement-section-header">
            <h2>お知らせ</h2>

            <a th:href="@{/announcements}">
                お知らせ一覧へ
            </a>
        </div>

        <p th:if="${#lists.isEmpty(announcements)}">
            現在お知らせはありません。
        </p>

        <div th:unless="${#lists.isEmpty(announcements)}" class="announcement-list">

            <div th:each="announcement : ${announcements}" class="announcement-item">

                <div class="announcement-meta">
                    <span class="announcement-importance"
                        th:classappend="' importance-' + ${#strings.toLowerCase(announcement.importance.name())}"
                        th:text="${announcement.importance.displayName}">
                    </span>

                    <span class="announcement-type" th:text="${announcement.type.displayName}">
                    </span>

                    <time th:text="${#temporals.format(
                        announcement.publishedAt,
                        'yyyy/MM/dd HH:mm')}">
                    </time>
                </div>

                <a th:href="@{/announcements/{id}(id=${announcement.id})}" th:text="${announcement.title}"
                    class="announcement-title">
                </a>

            </div>
        </div>
    </section>

    <section class="new-arrival-section">
        <div class="new-arrival-section-header">
            <h2>新着商品</h2>

            <a th:href="@{/products}" class="button button-secondary">
                商品一覧へ
            </a>
        </div>

        <p th:if="${#lists.isEmpty(latestProducts)}">
            現在表示できる商品はありません。
        </p>

        <div th:unless="${#lists.isEmpty(latestProducts)}" class="new-arrival-list">

            <div th:each="product : ${latestProducts}" class="new-arrival-item">

                <a th:href="@{/products/{id}(id=${product.id})}">

                    <img th:if="${product.imagePath != null}"
                        th:src="@{/product-images/{path}(path=${product.imagePath})}" th:alt="${product.name}"
                        style="max-width: 160px; height: auto;">

                    <div th:if="${product.imagePath == null}">
                        画像なし
                    </div>

                </a>

                <div>
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">
                    </a>
                </div>

                <div>
                    <span th:text="${#numbers.formatInteger(
                    product.price, 1, 'COMMA')}">
                    </span>円
                </div>

            </div>
        </div>
    </section>

    <section class="new-arrival-section">
        <div class="new-arrival-section-header">
            <h2>人気商品</h2>

            <a th:href="@{/products}" class="button button-secondary">
                商品一覧へ
            </a>
        </div>

        <p th:if="${#lists.isEmpty(popularProducts)}">
            現在表示できる人気商品はありません。
        </p>

        <div th:unless="${#lists.isEmpty(popularProducts)}" class="new-arrival-list">

            <div th:each="product : ${popularProducts}" class="new-arrival-item">

                <a th:href="@{/products/{id}(id=${product.id})}">

                    <img th:if="${product.imagePath != null}"
                        th:src="@{/product-images/{path}(path=${product.imagePath})}" th:alt="${product.name}"
                        style="max-width: 160px; height: auto;">

                    <div th:if="${product.imagePath == null}">
                        画像なし
                    </div>

                </a>

                <div>
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">
                    </a>
                </div>

                <div>
                    <span th:text="${#numbers.formatInteger(
                    product.price, 1, 'COMMA')}">
                    </span>円
                </div>

            </div>
        </div>
    </section>

    <section class="new-arrival-section" th:unless="${#lists.isEmpty(recentlyViewedProducts)}">

        <div class="new-arrival-section-header">
            <h2>最近チェックした商品</h2>

            <a th:href="@{/products}" class="button button-secondary">
                商品一覧へ
            </a>
        </div>

        <div class="new-arrival-list">

            <div th:each="product : ${recentlyViewedProducts}" class="new-arrival-item">

                <a th:href="@{/products/{id}(id=${product.id})}">

                    <img th:if="${product.imagePath != null}"
                        th:src="@{/product-images/{path}(path=${product.imagePath})}" th:alt="${product.name}"
                        style="max-width: 160px; height: auto;">

                    <div th:if="${product.imagePath == null}">
                        画像なし
                    </div>

                </a>

                <div>
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">
                    </a>
                </div>

                <div>
                    <span th:text="${#numbers.formatInteger(
                    product.price, 1, 'COMMA')}">
                    </span>円
                </div>

            </div>
        </div>
    </section>

    <section class="category-section">
        <div class="category-section-header">
            <h2>カテゴリから探す</h2>

            <a th:href="@{/products}" class="button button-secondary">
                すべての商品を見る
            </a>
        </div>

        <p th:if="${#lists.isEmpty(categories)}">
            現在表示できるカテゴリはありません。
        </p>

        <div th:unless="${#lists.isEmpty(categories)}" class="category-list">

            <a th:each="category : ${categories}" th:href="@{/products(categoryId=${category.id})}"
                th:text="${category.name}" class="button button-secondary">
            </a>

        </div>
    </section>

</body>

</html>
