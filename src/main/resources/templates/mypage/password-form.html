<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/header :: header}">
    </header>

    <h1>パスワード変更</h1>

    <form th:action="@{/mypage/password}" th:object="${passwordChangeForm}" method="post" class="form-card">

        <div class="form-group">
            <label for="currentPassword">
                現在のパスワード
                <span class="required">必須</span>
            </label>

            <input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>

            <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="field-error">
            </span>
        </div>

        <div class="form-group">
            <label for="newPassword">
                新しいパスワード
                <span class="required">必須</span>
            </label>

            <input type="password" th:field="*{newPassword}" minlength="8" maxlength="72" autocomplete="new-password"
                required>

            <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="field-error">
            </span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">
                新しいパスワード（確認）
                <span class="required">必須</span>
            </label>

            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>

            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="field-error">
            </span>
        </div>

        <div class="actions">
            <button type="submit" class="button-primary">
                パスワードを変更
            </button>

            <a th:href="@{/mypage}" class="button button-secondary">
                戻る
            </a>
        </div>

    </form>

</body>

</html>
