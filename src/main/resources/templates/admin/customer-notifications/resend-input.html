<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>お客様へのメール通知（再送）</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <main th:with="o=${detail.original}">
        <h1>お客様へのメール通知（再送）</h1>

        <p><a th:href="@{/admin/customer-notifications/{id}(id=${o.id})}">通知の詳細へ戻る</a></p>

        <dl>
            <dt>通知ID</dt>
            <dd th:text="${o.id}"></dd>
            <dt>注文番号</dt>
            <dd th:text="${o.orderId}"></dd>
            <dt>種類</dt>
            <dd th:text="${o.eventLabel}"></dd>
            <dt>現在の状態</dt>
            <dd th:text="${detail.chain[#lists.size(detail.chain) - 1].statusLabel}"></dd>
            <dt>これまでの再送</dt>
            <dd th:text="${detail.eligibility.resendCount} + ' 回（上限3回）'"></dd>
        </dl>

        <p th:unless="${detail.eligibility.allowed}" class="message-error" th:text="${detail.eligibility.refusal}"></p>

        <form th:if="${detail.eligibility.allowed}" th:action="@{/admin/customer-notifications/{id}/resend/confirm(id=${o.id})}"
            th:object="${resendForm}" method="post">
            <p>
                最初に記録したときの内容（明細・金額・お届け先）のまま、送信時点のお客様のメールアドレスへ送ります。
                メールアドレスが未確認のままなら、再送しても「送信対象外」になります。
            </p>
            <input type="hidden" th:field="*{nonce}">
            <input type="hidden" th:field="*{expectedResendCount}">
            <p th:if="${#fields.hasErrors('nonceValid')}" th:errors="*{nonceValid}" class="message-error"></p>
            <div>
                <label for="reason">再送理由（必須・500文字以内）</label>
                <textarea id="reason" th:field="*{reason}" rows="4" cols="60" maxlength="500"></textarea>
                <p th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}" class="message-error"></p>
            </div>
            <div th:if="${detail.eligibility.riskAcknowledgementRequired}">
                <p class="action-required-warning">
                    この通知は、以前の送信で結果が不明になっています。お客様にすでに届いている可能性があり、再送すると同じメールが2通届くことがあります。
                </p>
                <label>
                    <input type="checkbox" th:field="*{riskAcknowledged}">
                    お客様に同じメールが2通届く可能性があることを確認しました
                </label>
                <p th:if="${#fields.hasErrors('riskAcknowledged')}" th:errors="*{riskAcknowledged}" class="message-error"></p>
            </div>
            <button type="submit">確認画面へ</button>
        </form>
    </main>

</body>

</html>
