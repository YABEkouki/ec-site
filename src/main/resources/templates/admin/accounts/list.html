<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>管理者アカウント管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>管理者アカウント管理</h1>

    <p th:if="${successMessage}" th:text="${successMessage}">
    </p>

    <p>
        <a th:href="@{/admin/accounts/new}" class="button button-secondary">
            管理者アカウントを登録
        </a>
    </p>

    <p th:if="${adminAccountPage.empty}">
        管理者アカウントはありません。
    </p>

    <table th:unless="${adminAccountPage.empty}">
        <thead>
            <tr>
                <th>ID</th>
                <th>ユーザー名</th>
                <th>状態</th>
                <th>ログイン状況</th>
                <th>最終ログイン日時</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="adminAccount : ${adminAccountPage.content}">
                <td th:text="${adminAccount.id}">
                </td>

                <td th:text="${adminAccount.username}">
                </td>

                <td>
                    <span th:if="${adminAccount.enabled}">
                        有効
                    </span>

                    <span th:unless="${adminAccount.enabled}">
                        無効
                    </span>
                </td>

                <td>
                    <span th:if="${adminAccount.id == loginAdminId}">
                        ログイン中
                    </span>
                </td>

                <td th:text="${adminAccount.lastLoginAt != null
        ? #temporals.format(adminAccount.lastLoginAt, 'yyyy/MM/dd HH:mm:ss')
        : '未ログイン'}">
                    未ログイン
                </td>

                <td>
                    <a th:href="@{/admin/accounts/{id}/edit(id=${adminAccount.id})}" class="button button-secondary">
                        編集
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <nav th:if="${adminAccountPage.totalPages > 1}">
        <a th:if="${adminAccountPage.hasPrevious()}" th:href="@{/admin/accounts(page=${adminAccountPage.number - 1})}"
            class="button button-secondary">
            前へ
        </a>

        <span th:each="pageNumber :
            ${#numbers.sequence(
                0,
                adminAccountPage.totalPages - 1)}">

            <strong th:if="${pageNumber == adminAccountPage.number}" th:text="${pageNumber + 1}"
                class="button pagination-current">
            </strong>

            <a th:unless="${pageNumber == adminAccountPage.number}" th:href="@{/admin/accounts(page=${pageNumber})}"
                th:text="${pageNumber + 1}" class="button button-secondary">
            </a>
        </span>

        <a th:if="${adminAccountPage.hasNext()}" th:href="@{/admin/accounts(page=${adminAccountPage.number + 1})}"
            class="button button-secondary">
            次へ
        </a>
    </nav>

</body>

</html>
