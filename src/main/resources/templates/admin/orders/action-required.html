<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>要対応注文一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>要対応注文一覧</h1>

    <p>
        要対応・対応中の注文を表示しています。
    </p>

    <form th:action="@{/admin/orders/action-required}" th:object="${searchForm}" method="get">
        <div class="order-search-fields">

            <div class="order-search-field">
                <label for="orderId">注文番号</label>
                <input type="number" id="orderId" th:field="*{orderId}" min="1">
            </div>

            <div class="order-search-field">
                <label for="userId">ユーザーID</label>
                <input type="number" id="userId" th:field="*{userId}" min="1">
            </div>

            <div class="order-search-field">
                <label>注文日</label>

                <div class="order-search-date">
                    <input type="date" id="from" th:field="*{from}">

                    <span>～</span>

                    <input type="date" id="to" th:field="*{to}">
                </div>
            </div>

            <div class="order-search-field">
                <label for="status">注文状態</label>

                <select id="status" th:field="*{status}">
                    <option value="">すべて</option>

                    <option th:each="status : ${statuses}" th:value="${status.name()}" th:text="${status.displayName}">
                    </option>
                </select>
            </div>

            <div class="order-search-field">
                <label for="handlingStatus">対応状況</label>

                <select id="handlingStatus" th:field="*{handlingStatus}">
                    <option value="">すべて（要対応・対応中）</option>
                    <option th:each="handlingStatus : ${handlingStatuses}" th:value="${handlingStatus}"
                        th:text="${handlingStatus.displayName}">
                    </option>
                </select>
            </div>

            <div class="order-search-field">
                <label for="minElapsedDays">経過日数</label>

                <select id="minElapsedDays" th:field="*{minElapsedDays}">
                    <option value="">指定なし</option>
                    <option value="3">3日以上</option>
                    <option value="7">7日以上</option>
                </select>
            </div>

            <div class="order-search-field">
                <label for="sort">並び順</label>

                <select id="sort" th:field="*{sort}">
                    <option th:each="sort : ${actionRequiredOrderSorts}" th:value="${sort}"
                        th:text="${sort.displayName}">
                    </option>
                </select>
            </div>
        </div>

        <input type="hidden" name="size" th:value="${orderPage.size}">

        <div class="actions">
            <button type="submit" class="button-secondary">
                検索
            </button>

            <a th:href="@{/admin/orders/action-required}" class="button button-secondary">
                クリア
            </a>

        </div>

    </form>

    <p th:if="${#lists.isEmpty(orders)}">
        注文はありません。
    </p>

    <table th:unless="${#lists.isEmpty(orders)}">

        <thead>
            <tr>
                <th>注文番号</th>
                <th>ユーザーID</th>
                <th>注文日時</th>
                <th>受取人</th>
                <th>合計金額</th>
                <th>状態</th>
                <th>対応状況</th>
                <th>対応状況更新日時</th>
                <th>経過日数</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="item : ${orders}">

                <td th:text="${item.order.id}"></td>

                <td th:text="${item.order.userId}"></td>

                <td th:text="${#temporals.format(
                item.order.orderedAt,
                'yyyy/MM/dd HH:mm')}">
                </td>

                <td>
                    <span th:if="${item.order.shippingName != null}" th:text="${item.order.shippingName}">
                    </span>

                    <span th:unless="${item.order.shippingName != null}">
                        未登録
                    </span>
                </td>

                <td>
                    <span th:text="${#numbers.formatInteger(
                    item.order.totalAmount,
                    1,
                    'COMMA')}">
                    </span>
                    円
                </td>

                <td>
                    <span class="status-badge"
                        th:classappend="' status-' + ${#strings.toLowerCase(item.order.status.name())}"
                        th:text="${item.order.status.displayName}">
                    </span>
                </td>

                <td th:text="${item.order.handlingStatus.displayName}">
                </td>

                <td>
                    <span th:if="${item.handlingStatusUpdatedAt != null}" th:text="${#temporals.format(
                        item.handlingStatusUpdatedAt,
                        'yyyy/MM/dd HH:mm')}">
                    </span>

                    <span th:unless="${item.handlingStatusUpdatedAt != null}">
                        －
                    </span>
                </td>

                <td>
                    <span th:if="${item.elapsedDays != null}" th:text="${item.elapsedDays + '日'}" th:class="${item.elapsedDays >= 7}
                ? 'action-required-danger'
                : (${item.elapsedDays >= 3}
                    ? 'action-required-warning'
                    : '')">
                    </span>

                    <span th:unless="${item.elapsedDays != null}">
                        －
                    </span>
                </td>
                <td>
                    <a th:href="@{/admin/orders/{id}(
                    id=${item.order.id})}" class="button button-secondary">
                        詳細
                    </a>
                </td>

            </tr>
        </tbody>
    </table>

    <nav th:if="${orderPage.totalPages > 1}">

        <a th:if="${orderPage.hasPrevious()}" th:href="@{/admin/orders/action-required(
           orderId=${searchForm.orderId},
           userId=${searchForm.userId},
           from=${searchForm.from},
           to=${searchForm.to},
           status=${searchForm.status},
           handlingStatus=${searchForm.handlingStatus},
           minElapsedDays=${searchForm.minElapsedDays},
           sort=${searchForm.sort},
           page=${orderPage.number - 1},
           size=${orderPage.size})}" class="button button-secondary">
            前へ
        </a>

        <span th:each="pageNumber :
        ${#numbers.sequence(
            0,
            orderPage.totalPages - 1)}">

            <strong th:if="${pageNumber == orderPage.number}" th:text="${pageNumber + 1}"
                class="button button-secondary">
            </strong>

            <a th:unless="${pageNumber == orderPage.number}" th:href="@{/admin/orders/action-required(
               orderId=${searchForm.orderId},
               userId=${searchForm.userId},
               from=${searchForm.from},
               to=${searchForm.to},
               status=${searchForm.status},
               handlingStatus=${searchForm.handlingStatus},
               minElapsedDays=${searchForm.minElapsedDays},
               sort=${searchForm.sort},
               page=${pageNumber},
               size=${orderPage.size})}" th:text="${pageNumber + 1}" class="button button-secondary">
            </a>

        </span>

        <a th:if="${orderPage.hasNext()}" th:href="@{/admin/orders/action-required(
           orderId=${searchForm.orderId},
           userId=${searchForm.userId},
           from=${searchForm.from},
           to=${searchForm.to},
           status=${searchForm.status},
           handlingStatus=${searchForm.handlingStatus},
           minElapsedDays=${searchForm.minElapsedDays},
           sort=${searchForm.sort},
           page=${orderPage.number + 1},
           size=${orderPage.size})}" class="button button-secondary">
            次へ
        </a>

    </nav>

    <p>
        <a th:href="@{/admin/orders}" class="button button-secondary">
            注文一覧へ戻る
        </a>

        <a th:href="@{/admin}" class="button button-secondary">
            管理者トップへ戻る
        </a>
    </p>

</body>

</html>
