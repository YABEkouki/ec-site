<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>アカウント情報</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>アカウント情報</h1>

    <p th:if="${successMessage}" th:text="${successMessage}" class="message-success">
    </p>

    <table>
        <tbody>
            <tr>
                <th>ユーザー名</th>
                <td th:text="${account.username}"></td>
            </tr>

            <tr>
                <th>登録日時</th>
                <td th:text="${#temporals.format(account.createdAt, 'yyyy/MM/dd HH:mm:ss')}"></td>
            </tr>

            <tr>
                <th>アカウント更新日時</th>
                <td th:text="${#temporals.format(account.updatedAt, 'yyyy/MM/dd HH:mm:ss')}"></td>
            </tr>

            <tr>
                <th>前回ログイン日時</th>
                <td th:text="${account.previousLoginAt != null
                    ? #temporals.format(account.previousLoginAt, 'yyyy/MM/dd HH:mm:ss')
                    : '未ログイン'}">
                    未ログイン
                </td>
            </tr>

            <tr>
                <th>最終ログイン日時</th>
                <td th:text="${account.lastLoginAt != null
                    ? #temporals.format(account.lastLoginAt, 'yyyy/MM/dd HH:mm:ss')
                    : '未ログイン'}">
                    未ログイン
                </td>
            </tr>
        </tbody>
    </table>

    <div class="actions">
        <a th:href="@{/admin/account/password/edit}" class="button button-secondary">
            パスワードを変更
        </a>

        <a th:href="@{/admin}" class="button button-secondary">
            管理者トップへ戻る
        </a>
    </div>

</body>

</html>
