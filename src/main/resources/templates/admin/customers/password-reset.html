<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>パスワード再設定メール送信</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/admin-header :: header}"></header>

    <main>
        <h1>パスワード再設定メール送信</h1>

        <p>
            以下のユーザーへパスワード再設定メールを送信します。
        </p>

        <table>
            <tbody>
                <tr>
                    <th>顧客ID</th>
                    <td th:text="${customer.userId}"></td>
                </tr>
                <tr>
                    <th>ユーザー名</th>
                    <td th:text="${customer.username}"></td>
                </tr>
                <tr>
                    <th>送信先メールアドレス</th>
                    <td th:text="${customer.email}"></td>
                </tr>
            </tbody>
        </table>

        <p>
            メールに記載されたURLから、ユーザー自身で新しいパスワードを設定します。
        </p>

        <form th:action="@{/admin/customers/{id}/password-reset(id=${customer.userId})}" method="post">
            <button type="submit" class="button">
                再設定メールを送信
            </button>
        </form>

        <p>
            <a th:href="@{/admin/customers/{id}(id=${customer.userId})}" class="button button-secondary">
                キャンセル
            </a>
        </p>
    </main>

</body>

</html>
