<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>管理者メニュー</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h1>管理者メニュー</h1>

    <section>

        <h2>管理メニュー</h2>

        <ul>
            <li>
                <a th:href="@{/admin/products}">
                    商品管理
                </a>
            </li>

            <li>
                <a th:href="@{/admin/products/new}">
                    商品登録
                </a>
            </li>

            <li>
                <a th:href="@{/admin/products/inactive}">
                    非公開商品
                </a>
            </li>

            <li>
                <a th:href="@{/admin/orders}">
                    注文管理
                </a>
            </li>

        </ul>
        <p>
            <a th:href="@{/}" class="button button-secondary">
                一般TOPへ戻る
            </a>
        </p>

    </section>

    <section>

        <h2>注文状況</h2>

        <table>
            <thead>
                <tr>
                    <th>状態</th>
                    <th>件数</th>
                    <th>操作</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>注文受付</td>
                    <td th:text="${orderedCount}"></td>
                    <td>
                        <a th:href="@{/admin/orders(
                        status='ORDERED')}" class="button button-secondary">
                            一覧を見る
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>支払済み</td>
                    <td th:text="${paidCount}"></td>
                    <td>
                        <a th:href="@{/admin/orders(
                        status='PAID')}" class="button button-secondary">
                            一覧を見る
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>発送済み</td>
                    <td th:text="${shippedCount}"></td>
                    <td>
                        <a th:href="@{/admin/orders(
                        status='SHIPPED')}" class="button button-secondary">
                            一覧を見る
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>キャンセル</td>
                    <td th:text="${cancelledCount}"></td>
                    <td>
                        <a th:href="@{/admin/orders(
                        status='CANCELLED')}" class="button button-secondary">
                            一覧を見る
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <section>

            <h2>在庫警告</h2>

            <p>
                在庫
                <span th:text="${lowStockThreshold}"></span>
                個以下の公開商品を表示しています。
            </p>

            <p th:if="${#lists.isEmpty(lowStockProducts)}">
                在庫が少ない商品はありません。
            </p>

            <table th:unless="${#lists.isEmpty(lowStockProducts)}">

                <thead>
                    <tr>
                        <th>商品ID</th>
                        <th>商品名</th>
                        <th>在庫数</th>
                        <th>操作</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="product : ${lowStockProducts}">

                        <td th:text="${product.id}"></td>

                        <td th:text="${product.name}"></td>

                        <td th:text="${product.stock}" 
                            th:class="${product.stock == 0}
                                ? 'stock-empty'
                                : 'stock-low'">
                        </td>

                        <td>
                            <a th:href="@{/admin/products/{id}/edit(
                        id=${product.id})}" class="button button-secondary">
                                商品を編集
                            </a>
                        </td>

                    </tr>
                </tbody>
            </table>

        </section>

    </section>




    <form th:action="@{/logout}" method="post">
        <button type="submit" class="button-secondary">ログアウト</button>
    </form>

</body>

</html>
