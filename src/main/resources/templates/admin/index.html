<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>管理者メニュー</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <section>

        <h2>注文状況</h2>

        <table>
            <thead>
                <tr>
                    <th>状態</th>
                    <th>件数</th>
                    <th>操作</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>注文受付</td>
                    <td th:text="${orderedCount}"></td>
                    <td>
                        <a th:href="@{/admin/orders(
                        status='ORDERED')}" class="button button-secondary">
                            一覧を見る
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>支払済み</td>
                    <td th:text="${paidCount}"></td>
                    <td>
                        <a th:href="@{/admin/orders(
                        status='PAID')}" class="button button-secondary">
                            一覧を見る
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>発送済み</td>
                    <td th:text="${shippedCount}"></td>
                    <td>
                        <a th:href="@{/admin/orders(
                        status='SHIPPED')}" class="button button-secondary">
                            一覧を見る
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>キャンセル</td>
                    <td th:text="${cancelledCount}"></td>
                    <td>
                        <a th:href="@{/admin/orders(
                        status='CANCELLED')}" class="button button-secondary">
                            一覧を見る
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <p>
            <a th:href="@{/admin/order-status-histories}" class="button button-secondary">
                注文ステータス変更履歴を見る
            </a>
        </p>

        <h2>注文対応状況</h2>

        <table>
            <thead>
                <tr>
                    <th>対応状況</th>
                    <th>件数</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>通常</td>
                    <td th:text="${normalHandlingCount}">0</td>
                    <td>
                        <a th:href="@{/admin/orders(handlingStatus='NONE')}">
                            一覧を見る
                        </a>
                    </td>
                </tr>
                <tr>
                    <td><strong>要対応</strong></td>
                    <td><strong th:text="${needsActionCount}">0</strong></td>
                    <td>
                        <a th:href="@{/admin/orders/action-required(handlingStatus='NEEDS_ACTION')}">
                            <strong>一覧を見る</strong>
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>対応中</td>
                    <td th:text="${inProgressCount}">0</td>
                    <td>
                        <a th:href="@{/admin/orders/action-required(handlingStatus='IN_PROGRESS')}">
                            一覧を見る
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>対応済み</td>
                    <td th:text="${resolvedCount}">0</td>
                    <td>
                        <a th:href="@{/admin/orders(handlingStatus='RESOLVED')}">
                            一覧を見る
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/admin/orders/action-required}" class="button button-secondary">
            要対応注文一覧
        </a>

        <h2>要対応注文の滞留状況</h2>

        <table>
            <thead>
                <tr>
                    <th>滞留期間</th>
                    <th>件数</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>3日以上滞留</td>
                    <td th:text="${actionRequiredAgingSummary.threeDaysOrMoreCount}">
                        0
                    </td>
                    <td>
                        <a th:href="@{/admin/orders/action-required(
                    minElapsedDays=3,
                    sort='OLDEST'
                )}">
                            一覧を見る
                        </a>
                    </td>
                </tr>

                <tr>
                    <td><strong>7日以上滞留</strong></td>
                    <td>
                        <strong th:text="${actionRequiredAgingSummary.sevenDaysOrMoreCount}">
                            0
                        </strong>
                    </td>
                    <td>
                        <a th:href="@{/admin/orders/action-required(
                    minElapsedDays=7,
                    sort='OLDEST'
                )}">
                            <strong>一覧を見る</strong>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <section>

            <h2>在庫警告</h2>

            <p>
                在庫
                <span th:text="${lowStockThreshold}"></span>
                個以下の公開商品を表示しています。
            </p>

            <p th:if="${#lists.isEmpty(lowStockProducts)}">
                在庫が少ない商品はありません。
            </p>

            <table th:unless="${#lists.isEmpty(lowStockProducts)}">

                <thead>
                    <tr>
                        <th>商品ID</th>
                        <th>商品名</th>
                        <th>在庫数</th>
                        <th>操作</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="product : ${lowStockProducts}">

                        <td th:text="${product.id}"></td>

                        <td th:text="${product.name}"></td>

                        <td th:text="${product.stock}" th:class="${product.stock == 0}
                                ? 'stock-empty'
                                : 'stock-low'">
                        </td>

                        <td>
                            <a th:href="@{/admin/products/{id}/stock(
                        id=${product.id})}" class="button button-secondary">
                                在庫調整
                            </a>
                        </td>

                    </tr>
                </tbody>
            </table>

        </section>

    </section>

</body>

</html>
