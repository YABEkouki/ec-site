<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>注文対応状況変更履歴</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>注文対応状況変更履歴</h1>

    <form th:action="@{/admin/order-handling-status-histories}" th:object="${searchForm}" method="get">

        <div>
            <label for="orderId">注文ID</label>
            <input type="number" id="orderId" th:field="*{orderId}">
        </div>

        <div>
            <label for="fromStatus">変更前対応状況</label>
            <select id="fromStatus" th:field="*{fromStatus}">
                <option value="">すべて</option>
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status.displayName}">
                </option>
            </select>
        </div>

        <div>
            <label for="toStatus">変更後対応状況</label>
            <select id="toStatus" th:field="*{toStatus}">
                <option value="">すべて</option>
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status.displayName}">
                </option>
            </select>
        </div>

        <div>
            <label for="changedByUsername">管理者ユーザー名</label>
            <input type="text" id="changedByUsername" th:field="*{changedByUsername}">
        </div>

        <div>
            <label for="from">変更日 From</label>
            <input type="date" id="from" th:field="*{from}">
        </div>

        <div>
            <label for="to">変更日 To</label>
            <input type="date" id="to" th:field="*{to}">
        </div>

        <button type="submit">
            検索
        </button>

        <button type="button" onclick="location.href='/admin/order-handling-status-histories'">
            条件クリア
        </button>

    </form>

    <hr>

    <table>
        <thead>
            <tr>
                <th>変更日時</th>
                <th>注文ID</th>
                <th>変更前</th>
                <th>変更後</th>
                <th>管理者ID</th>
                <th>管理者ユーザー名</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="history : ${histories}">

                <td th:text="${#temporals.format(
                        history.changedAt,
                        'yyyy-MM-dd HH:mm:ss')}">
                </td>

                <td>
                    <a th:href="@{/admin/orders/{id}(id=${history.order.id})}" th:text="${history.order.id}">
                    </a>
                </td>

                <td th:text="${history.fromStatus.displayName}">
                </td>

                <td th:text="${history.toStatus.displayName}">
                </td>

                <td th:text="${history.changedByAccountId}">
                </td>

                <td th:text="${history.changedByUsername}">
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(histories)}">
                <td colspan="6">
                    対応状況変更履歴はありません。
                </td>
            </tr>

        </tbody>
    </table>

    <div th:if="${historyPage.totalPages > 1}">

        <a th:if="${historyPage.hasPrevious()}" th:href="@{/admin/order-handling-status-histories(
               page=${historyPage.number - 1},
               size=${historyPage.size},
               orderId=${searchForm.orderId},
               fromStatus=${searchForm.fromStatus},
               toStatus=${searchForm.toStatus},
               changedByUsername=${searchForm.changedByUsername},
               from=${searchForm.from},
               to=${searchForm.to})}">
            前へ
        </a>

        <span th:text="${historyPage.number + 1}"></span>
        /
        <span th:text="${historyPage.totalPages}"></span>

        <a th:if="${historyPage.hasNext()}" th:href="@{/admin/order-handling-status-histories(
               page=${historyPage.number + 1},
               size=${historyPage.size},
               orderId=${searchForm.orderId},
               fromStatus=${searchForm.fromStatus},
               toStatus=${searchForm.toStatus},
               changedByUsername=${searchForm.changedByUsername},
               from=${searchForm.from},
               to=${searchForm.to})}">
            次へ
        </a>

    </div>

</body>

</html>
