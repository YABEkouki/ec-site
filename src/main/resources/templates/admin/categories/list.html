<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>カテゴリ管理</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>カテゴリ管理</h1>

    <p th:if="${successMessage}" th:text="${successMessage}" class="message-success">
    </p>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="message-error">
    </p>

    <h2>カテゴリ登録</h2>

    <form th:action="@{/admin/categories}" th:object="${categoryForm}" method="post">

        <label for="name"> カテゴリ名 </label>
        <input type="text" id="name" th:field="*{name}" maxlength="100" required>

        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"> </p>
        <label for="displayOrder"> 表示順 </label>

        <input type="number" id="displayOrder" th:field="*{displayOrder}" min="0" required>
        <p th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}" class="field-error"> </p>

        <button type="submit" class="button-primary"> 登録 </button>

    </form>

    <h2>カテゴリ一覧</h2>

    <p th:if="${#lists.isEmpty(categories)}">
        登録されているカテゴリはありません。
    </p>

    <table th:unless="${#lists.isEmpty(categories)}">

        <thead>
            <tr>
                <th>ID</th>
                <th>カテゴリ名</th>
                <th>表示順</th>
                <th>状態</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.id}"></td>
                <td th:text="${category.name}"></td>
                <td th:text="${category.displayOrder}"></td>
                <td th:text="${category.active ? '有効' : '無効'}"></td>
                <td>
                    <a th:if="${!category.systemCategory}" th:href="@{/admin/categories/{id}/edit(id=${category.id})}"
                        class="button button-secondary">
                        編集
                    </a>

                    <form th:if="${!category.systemCategory and category.active}"
                        th:action="@{/admin/categories/{id}/deactivate(id=${category.id})}" method="post"
                        style="display: inline;" onsubmit="return confirm('このカテゴリを無効化しますか？');">

                        <button type="submit" class="button-danger">
                            無効化
                        </button>
                    </form>

                    <form th:if="${!category.systemCategory and !category.active}"
                        th:action="@{/admin/categories/{id}/activate(id=${category.id})}" method="post"
                        style="display: inline;">

                        <button type="submit" class="button-primary">
                            有効化
                        </button>
                    </form>

                    <span th:if="${category.systemCategory}">
                        変更不可
                    </span>
                </td>
            </tr>
        </tbody>

    </table>

    <p>
        <a th:href="@{/admin}" class="button button-secondary">
            管理者メニューへ戻る
        </a>
    </p>

</body>

</html>
