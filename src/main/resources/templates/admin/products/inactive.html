<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>販売終了商品一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/admin-header :: header}">
    </header>
    
    <h1>販売終了商品一覧</h1>

    <p th:if="${successMessage}" th:text="${successMessage}" class="message-success">
    </p>

    <p th:if="${#lists.isEmpty(products)}">
        販売終了商品はありません。
    </p>

    <table th:unless="${#lists.isEmpty(products)}">

        <thead>
            <tr>
                <th>ID</th>
                <th>商品名</th>
                <th>価格</th>
                <th>在庫</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="product : ${products}">

                <td th:text="${product.id}"></td>

                <td th:text="${product.name}"></td>

                <td>
                    <span th:text="${#numbers.formatInteger(
                    product.price, 1, 'COMMA')}">
                    </span>
                    円
                </td>

                <td th:text="${product.stock}"></td>

                <td>
                    <form th:action="@{/admin/products/{id}/restore(
                    id=${product.id})}" method="post">

                        <button type="submit" class="button-primary">
                            販売中に戻す
                        </button>
                    </form>
                </td>

            </tr>
        </tbody>
    </table>

    <nav th:if="${productPage.totalPages > 1}">

        <a th:if="${productPage.hasPrevious()}" th:href="@{/admin/products/inactive(
           page=${productPage.number - 1},
           size=${productPage.size})}">
            前へ
        </a>

        <span th:each="pageNumber :
            ${#numbers.sequence(
                0,
                productPage.totalPages - 1)}">

            <strong th:if="${pageNumber == productPage.number}" th:text="${pageNumber + 1}">
            </strong>

            <a th:unless="${pageNumber == productPage.number}" th:href="@{/admin/products/inactive(
               page=${pageNumber},
               size=${productPage.size})}" th:text="${pageNumber + 1}">
            </a>

        </span>

        <a th:if="${productPage.hasNext()}" th:href="@{/admin/products/inactive(
           page=${productPage.number + 1},
           size=${productPage.size})}">
            次へ
        </a>

    </nav>

    <p>
        <a th:href="@{/admin}" class="button button-secondary">
            管理者メニューへ戻る
        </a>
    </p>

</body>

</html>
