<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>在庫変更履歴</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>在庫変更履歴</h1>

    <div class="form-card">

        <div class="form-group">
            <label>商品名</label>
            <p th:text="${product.name}"></p>
        </div>

        <div class="form-group">
            <label>現在在庫</label>
            <p>
                <strong th:text="${product.stock}"></strong>
                個
            </p>
        </div>

    </div>

    <form th:action="@{/admin/products/{id}/stock/history(id=${product.id})}"
          method="get"
          class="form-card">

        <div class="form-group">

            <label for="from">
                変更日（開始）
            </label>

            <input type="date"
                   id="from"
                   name="from"
                   th:value="${from}">
        </div>

        <div class="form-group">

            <label for="to">
                変更日（終了）
            </label>

            <input type="date"
                   id="to"
                   name="to"
                   th:value="${to}">
        </div>

        <div class="form-group">

            <label for="username">
                操作者
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   maxlength="100"
                   th:value="${username}">
        </div>

        <div class="actions">

            <button type="submit"
                    class="button-primary">
                検索
            </button>

            <a th:href="@{/admin/products/{id}/stock/history(id=${product.id})}"
               class="button button-secondary">
                クリア
            </a>

        </div>

    </form>

    <p>
        件数：
        <span th:text="${movementPage.totalElements}"></span>
    </p>

    <p th:if="${#lists.isEmpty(movements)}">
        在庫変更履歴はありません。
    </p>

    <table th:unless="${#lists.isEmpty(movements)}">

        <thead>
            <tr>
                <th>変更日時</th>
                <th>変更数</th>
                <th>変更前</th>
                <th>変更後</th>
                <th>操作者</th>
                <th>理由</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="movement : ${movements}">

                <td th:text="${#temporals.format(
                    movement.changedAt,
                    'yyyy/MM/dd HH:mm:ss')}">
                </td>

                <td th:text="${movement.quantity > 0
                    ? '+' + movement.quantity
                    : movement.quantity}">
                </td>

                <td th:text="${movement.stockBefore}">
                </td>

                <td th:text="${movement.stockAfter}">
                </td>

                <td th:text="${movement.changedByUsername}">
                </td>

                <td th:text="${movement.reason != null
                    && !movement.reason.isBlank()
                    ? movement.reason
                    : '-'}">
                </td>

            </tr>

        </tbody>

    </table>

    <nav th:if="${movementPage.totalPages > 1}">

        <a th:if="${movementPage.hasPrevious()}"
           th:href="@{/admin/products/{id}/stock/history(
                id=${product.id},
                from=${from},
                to=${to},
                username=${username},
                page=${movementPage.number - 1})}"
           class="button button-secondary">
            前へ
        </a>

        <span th:each="pageNumber :
            ${#numbers.sequence(
                0,
                movementPage.totalPages - 1)}">

            <strong th:if="${pageNumber == movementPage.number}"
                    th:text="${pageNumber + 1}"
                    class="button button-secondary">
            </strong>

            <a th:unless="${pageNumber == movementPage.number}"
               th:href="@{/admin/products/{id}/stock/history(
                    id=${product.id},
                    from=${from},
                    to=${to},
                    username=${username},
                    page=${pageNumber})}"
               th:text="${pageNumber + 1}"
               class="button button-secondary">
            </a>

        </span>

        <a th:if="${movementPage.hasNext()}"
           th:href="@{/admin/products/{id}/stock/history(
                id=${product.id},
                from=${from},
                to=${to},
                username=${username},
                page=${movementPage.number + 1})}"
           class="button button-secondary">
            次へ
        </a>

    </nav>

    <div class="actions">

        <a th:href="@{/admin/products/{id}/stock(id=${product.id})}"
           class="button button-secondary">
            在庫調整へ戻る
        </a>

        <a th:href="@{/admin/products}"
           class="button button-secondary">
            商品一覧へ戻る
        </a>

    </div>

</body>

</html>
