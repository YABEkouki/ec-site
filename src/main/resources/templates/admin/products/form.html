<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品登録</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>商品登録</h1>

    <form th:action="@{/admin/products}" th:object="${productForm}" method="post" class="form-card">

        <div class="form-group">

            <label for="name">
                商品名
                <span class="required">必須</span>
            </label>

            <input type="text" th:field="*{name}" maxlength="100" required>

            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error">
            </span>

        </div>

        <div class="form-group">
            <label for="categoryId">
                カテゴリ：
            </label>

            <select id="categoryId" th:field="*{categoryId}" required>

                <option value="">
                    選択してください
                </option>

                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">
                </option>

            </select>

            <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="field-error">
            </span>
        </div>

        <div class="form-group">

            <label for="price">
                価格
                <span class="required">必須</span>
            </label>

            <input type="number" th:field="*{price}" min="0" step="1" required>

            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="field-error">
            </span>

        </div>

        <div class="form-group">

            <label for="stock">
                在庫
                <span class="required">必須</span>
            </label>

            <input type="number" th:field="*{stock}" min="0" step="1" required>

            <span th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" class="field-error">
            </span>

        </div>

        <div class="form-group">

            <label for="description">
                説明
            </label>

            <textarea th:field="*{description}" rows="5">
        </textarea>

            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error">
            </span>

        </div>

        <div class="actions">

            <button type="submit" class="button-primary">
                登録
            </button>

            <a th:href="@{/admin/products}" class="button button-secondary">
                商品一覧へ戻る
            </a>

        </div>

    </form>

</body>

</html>
