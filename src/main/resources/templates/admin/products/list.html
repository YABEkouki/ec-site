<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>商品管理</h1>

    <p th:if="${successMessage}" th:text="${successMessage}" class="message-success">
    </p>

    <p th:if="${message}" th:text="${message}" class="message-success">
    </p>

    <p>
        <a th:href="@{/admin/products/new}" class="button button-secondary">
            新規商品登録
        </a>
    </p>

    <p>
        <a th:href="@{/admin/products/inactive}" class="button button-secondary">
            販売終了商品一覧
        </a>
    </p>

    <form th:action="@{/admin/products}" th:object="${searchForm}" method="get">

        <label for="keyword">キーワード</label>
        <input id="keyword" type="text" th:field="*{keyword}">

        <label for="categoryId">カテゴリ</label>
        <select id="categoryId" th:field="*{categoryId}">
            <option value="">すべて</option>
            <option th:each="category : ${categories}" th:value="${category.id}"
                th:text="${category.active ? category.name : category.name + '（無効）'}">
            </option>
        </select>

        <label for="minPrice">最低価格</label>
        <input id="minPrice" type="number" min="0" th:field="*{minPrice}">

        <label for="maxPrice">最高価格</label>
        <input id="maxPrice" type="number" min="0" th:field="*{maxPrice}">

        <label for="inStockOnly">
            <input id="inStockOnly" type="checkbox" th:field="*{inStockOnly}">
            在庫ありのみ
        </label>

        <label for="sort">並び順</label>
        <select id="sort" th:field="*{sort}">
            <option value="newest">新しい順</option>
            <option value="nameAsc">商品名順</option>
            <option value="priceAsc">価格が安い順</option>
            <option value="priceDesc">価格が高い順</option>
        </select>

        <div th:if="${#fields.hasErrors('*')}">
            <p th:each="error : ${#fields.errors('*')}" th:text="${error}">
            </p>
        </div>

        <button type="submit" class="button-secondary">検索</button>
        <a th:href="@{/admin/products}" class="button button-secondary">クリア</a>
    </form>

    <p>
        件数：
        <span th:text="${productPage.totalElements}"></span>
    </p>

    <p th:if="${#lists.isEmpty(products)}">
        該当する商品はありません。
    </p>

    <table th:unless="${#lists.isEmpty(products)}">

        <thead>
            <tr>
                <th>ID</th>
                <th>画像</th>
                <th>商品名</th>
                <th>カテゴリ</th>
                <th>価格</th>
                <th>在庫</th>
                <th>更新日時</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="product : ${products}">

                <td th:text="${product.id}"></td>

                <td>
                    <img th:if="${product.imagePath != null}"
                        th:src="@{/product-images/{path}(path=${product.imagePath})}" th:alt="${product.name}"
                        style="max-width: 80px; height: auto;">

                    <span th:if="${product.imagePath == null}">
                        画像なし
                    </span>
                </td>

                <td th:text="${product.name}"></td>

                <td th:text="${product.category.name}">
                </td>

                <td>
                    <span th:text="${#numbers.formatInteger(
                    product.price,
                    1,
                    'COMMA')}">
                    </span>
                    円
                </td>

                <td th:text="${product.stock}"></td>

                <td th:text="${#temporals.format(
                product.updatedAt,
                'yyyy/MM/dd HH:mm')}">
                </td>

                <td>
                    <div class="actions">
                        <a th:href="@{/admin/products/{id}/edit(id=${product.id}, returnUrl=${returnUrl})}"
                            class="button button-secondary">
                            編集
                        </a>

                        <a th:href="@{/admin/products/{id}/stock(id=${product.id}, returnUrl=${returnUrl})}"
                            class="button button-secondary">
                            在庫調整
                        </a>

                        <a th:href="@{/products/{id}(id=${product.id})}" target="_blank" rel="noopener"
                            class="button button-secondary">
                            公開画面を確認
                        </a>

                        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"
                            class="inline-form">

                            <button type="submit" class="button-primary">
                                販売終了
                            </button>
                        </form>
                    </div>
                </td>

            </tr>
        </tbody>
    </table>

    <nav th:if="${productPage.totalPages > 1}">

        <a th:if="${productPage.hasPrevious()}" th:href="@{/admin/products(
       keyword=${searchForm.keyword},
       categoryId=${searchForm.categoryId},
       minPrice=${searchForm.minPrice},
       maxPrice=${searchForm.maxPrice},
       inStockOnly=${searchForm.inStockOnly},
       sort=${searchForm.sort},
       page=${productPage.number - 1})}" class="button button-secondary">
            前へ
        </a>

        <span th:each="pageNumber : ${#numbers.sequence(0, productPage.totalPages - 1)}">

            <strong th:if="${pageNumber == productPage.number}" th:text="${pageNumber + 1}"
                class="button pagination-current">
            </strong>

            <a th:unless="${pageNumber == productPage.number}" th:href="@{/admin/products(
           keyword=${searchForm.keyword},
           categoryId=${searchForm.categoryId},
           minPrice=${searchForm.minPrice},
           maxPrice=${searchForm.maxPrice},
           inStockOnly=${searchForm.inStockOnly},
           sort=${searchForm.sort},
           page=${pageNumber})}" th:text="${pageNumber + 1}" class="button button-secondary">
            </a>

        </span>
        <a th:if="${productPage.hasNext()}" th:href="@{/admin/products(
       keyword=${searchForm.keyword},
       categoryId=${searchForm.categoryId},
       minPrice=${searchForm.minPrice},
       maxPrice=${searchForm.maxPrice},
       inStockOnly=${searchForm.inStockOnly},
       sort=${searchForm.sort},
       page=${productPage.number + 1})}" class="button button-secondary">
            次へ
        </a>
    </nav>
</body>

</html>
