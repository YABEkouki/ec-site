<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品編集</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/admin-header :: header}">
    </header>

    <h1>商品編集</h1>

    <form th:action="@{/admin/products/{id}/update(
          id=${productId})}" th:object="${productForm}" method="post" enctype="multipart/form-data" class="form-card">

        <div class="form-group">

            <label for="name">
                商品名
                <span class="required">必須</span>
            </label>

            <input type="text" th:field="*{name}" maxlength="100" required>

            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error">
            </span>

        </div>

        <div class="form-group">

            <label for="categoryId">
                カテゴリ
            </label>

            <select id="categoryId" th:field="*{categoryId}" required>

                <option value="">
                    選択してください
                </option>

                <option th:each="category : ${categories}" th:value="${category.id}"
                    th:text="${category.active ? category.name : category.name + '（無効）'}">
                </option>

            </select>

            <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="field-error">
            </p>
        </div>

        <div class="form-group">

            <label for="price">
                価格
                <span class="required">必須</span>
            </label>

            <input type="number" th:field="*{price}" min="0" step="1" required>

            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="field-error">
            </span>

        </div>

        <div class="form-group">

            <label>
                現在在庫
            </label>

            <p>
                <strong th:text="${product.stock}"></strong>
                個
            </p>

            <a th:href="@{/admin/products/{id}/stock(id=${productId}, returnTo='edit')}"
                class="button button-secondary">
                在庫を調整
            </a>

        </div>
        <div class="form-group">

            <label for="description">
                説明
            </label>

            <textarea th:field="*{description}" rows="5">
        </textarea>

            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error">
            </span>

        </div>

        <div class="form-group">

            <label for="imageFile">
                商品画像
            </label>

            <div th:if="${product.imagePath != null}">
                <p>現在の画像</p>

                <img th:src="@{/product-images/{path}(path=${product.imagePath})}" alt="商品画像"
                    style="max-width: 300px; height: auto;">
            </div>

            <div th:if="${product.imagePath == null}">
                <p>画像は登録されていません。</p>
            </div>

            <input type="file" id="imageFile" th:field="*{imageFile}" accept="image/jpeg,image/png,image/webp">

            <small>
                JPEG、PNG、WebP形式、5MB以内
            </small>

            <span th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}" class="field-error">
            </span>

        </div>

        <div class="actions">

            <button type="submit" class="button-primary">
                更新
            </button>

            <a th:href="@{/admin/products}" class="button button-secondary">
                商品一覧へ戻る
            </a>

        </div>

    </form>

</body>

</html>
