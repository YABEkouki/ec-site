<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>商品詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}">
    </header>

    <h1>商品詳細</h1>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="message-error">
    </p>

    <p>
        ID：
        <span th:text="${product.id}"></span>
    </p>

    <p>
        商品名：
        <span th:text="${product.name}"></span>
    </p>

    <p>
        価格：
        <span th:text="${product.price}"></span>円
    </p>

    <p>
        在庫：
        <span th:text="${product.stock}"></span>
    </p>

    <p>
        説明：
        <span th:text="${product.description}"></span>
    </p>

    <form th:action="@{/cart/add}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}">

        <label>
            数量：
            <input type="number" name="quantity" value="1" min="1" max="99">
        </label>

        <button type="submit" class="button-primary">
            カートに追加
        </button>
    </form>

    <p>
        <a th:href="@{/products}" class="button button-secondary">
            商品一覧へ戻る
        </a>
    </p>

</body>

</html>
