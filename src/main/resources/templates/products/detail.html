<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>商品詳細</title>
</head>

<body>

    <h1>商品詳細</h1>

    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;">
    </p>

    <p>
        ID：
        <span th:text="${product.id}"></span>
    </p>

    <p>
        商品名：
        <span th:text="${product.name}"></span>
    </p>

    <p>
        価格：
        <span th:text="${product.price}"></span>円
    </p>

    <p>
        在庫：
        <span th:text="${product.stock}"></span>
    </p>

    <p>
        説明：
        <span th:text="${product.description}"></span>
    </p>

    <form th:action="@{/cart/add}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}">

        <label>
            数量：
            <input type="number" name="quantity" value="1" min="1">
        </label>

        <button type="submit">
            カートに追加
        </button>
    </form>

    <div sec:authorize="hasRole('ADMIN')">
        <p>
            <a th:href="@{/admin/products/{id}/edit(id=${product.id})}">
                編集
            </a>
        </p>

        <form th:action="@{/admin/products/{id}/delete(
        id=${product.id})}" method="post">

            <button type="submit">
                販売終了
            </button>
        </form>
    </div>

    <p>
        <a th:href="@{/products}">商品一覧へ戻る</a>
    </p>

</body>

</html>
