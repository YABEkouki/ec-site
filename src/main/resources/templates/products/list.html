<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>商品一覧</title>
</head>

<body>

    <form th:action="@{/products}" method="get">

        <label for="keyword">商品名</label>

        <input type="text" id="keyword" name="keyword" th:value="${keyword}" placeholder="商品名を入力">
        <label for="sort">並び順</label>

        <select id="sort" name="sort">

            <option value="newest" th:selected="${sort == 'newest'}">
                新着順
            </option>

            <option value="nameAsc" th:selected="${sort == 'nameAsc'}">
                商品名順
            </option>

            <option value="priceAsc" th:selected="${sort == 'priceAsc'}">
                価格の安い順
            </option>

            <option value="priceDesc" th:selected="${sort == 'priceDesc'}">
                価格の高い順
            </option>

        </select>

        <button type="submit">検索</button>

        <a th:href="@{/products}">
            クリア
        </a>

    </form>

    <h1>商品一覧</h1>

    <p th:if="${message}" th:text="${message}" style="color:green">
    </p>

    <p>
        <a th:href="@{/products/new}" sec:authorize="hasRole('ADMIN')">
            新規商品登録
        </a>
    </p>

    <p th:if="${#lists.isEmpty(products)}">
        該当する商品はありません。
    </p>

    <p>
        件数：
        <span th:text="${products.size()}"></span>
    </p>

    <table th:unless="${#lists.isEmpty(products)}" border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>商品名</th>
                <th>価格</th>
                <th>在庫</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td>
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">
                    </a>
                </td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.stock}"></td>

                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/products/{id}/edit(id=${product.id})}">
                        編集
                    </a>
                    <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" style="display:inline">

                        <button type="submit" onclick="return confirm('本当に削除しますか？')">
                            削除
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${productPage.totalPages > 0}">


        <div th:if="${productPage.totalPages > 0}">

            <a th:if="${productPage.hasPrevious()}" th:href="@{/products(
            keyword=${keyword},
            sort=${sort},
            page=${productPage.number - 1}
       )}">
                前へ
            </a>

            <span th:each="pageNumber :
                  ${#numbers.sequence(
                      0,
                      productPage.totalPages - 1)}">

                <span th:if="${pageNumber == productPage.number}" th:text="${pageNumber + 1}">
                </span>

                <a th:unless="${pageNumber == productPage.number}" th:href="@{/products(
                keyword=${keyword},
                sort=${sort},
                page=${pageNumber}
           )}" th:text="${pageNumber + 1}">
                </a>

            </span>

            <a th:if="${productPage.hasNext()}" th:href="@{/products(
            keyword=${keyword},
            sort=${sort},
            page=${productPage.number + 1}
       )}">
                次へ
            </a>

        </div>
    </div>

    <p>
        <a th:href="@{/}">トップページへ戻る</a>
    </p>

</body>

</html>
