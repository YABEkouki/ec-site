<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>商品一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}">
    </header>

    <h1>商品一覧</h1>

    <form th:action="@{/products}" th:object="${searchForm}" method="get">

        <div th:if="${#fields.hasErrors('*')}" class="message-error">
            <p th:each="error : ${#fields.errors('*')}" th:text="${error}">
            </p>
        </div>

        <label for="keyword">
            キーワード
        </label>

        <input type="text" id="keyword" th:field="*{keyword}" placeholder="商品名・説明・検索キーワード">

        <label for="categoryId">
            カテゴリ
        </label>

        <select id="categoryId" th:field="*{categoryId}">
            <option value="">
                すべて
            </option>

            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">
            </option>
        </select>

        <label for="minPrice">
            最低価格
        </label>

        <input type="number" id="minPrice" th:field="*{minPrice}" min="0" placeholder="0">

        <span>円 ～</span>

        <label for="maxPrice">
            最高価格
        </label>

        <input type="number" id="maxPrice" th:field="*{maxPrice}" min="0" placeholder="上限なし">

        <span>円</span>

        <label>
            <input type="checkbox" th:field="*{inStockOnly}">
            在庫ありのみ
        </label>

        <label for="sort">
            並び順
        </label>

        <select id="sort" th:field="*{sort}">
            <option value="newest">
                新着順
            </option>
            <option value="nameAsc">
                商品名順
            </option>
            <option value="priceAsc">
                価格の安い順
            </option>
            <option value="priceDesc">
                価格の高い順
            </option>
        </select>

        <button type="submit" class="button-secondary">
            検索
        </button>

        <a th:href="@{/products}" class="button button-secondary">
            クリア
        </a>

    </form>

    <p th:if="${message}" th:text="${message}" class="message-success">
    </p>

    <p th:if="${#lists.isEmpty(products)}">
        該当する商品はありません。
    </p>

    <p>
        件数：
        <span th:text="${productPage.totalElements}"></span>
    </p>

    <table th:unless="${#lists.isEmpty(products)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>画像</th>
                <th>商品名</th>
                <th>カテゴリ</th>
                <th>価格</th>
                <th>在庫</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td>
                    <img th:if="${product.imagePath != null}"
                        th:src="@{/product-images/{path}(path=${product.imagePath})}" th:alt="${product.name}"
                        style="max-width: 80px; height: auto;">

                    <span th:if="${product.imagePath == null}">
                        画像なし
                    </span>
                </td>
                <td>
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">
                    </a>
                </td>
                <td th:text="${product.category.name}">
                </td>
                <td>
                    <span th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')}"></span>円
                </td>

                <td th:classappend="${product.stock == 0} ? 'stock-empty' : (${product.stock <= 5} ? 'stock-low' : '')">

                    <span th:text="${product.stock}"></span>個

                    <span th:if="${product.stock == 0}">
                        （在庫切れ）
                    </span>

                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${productPage.totalPages > 0}">

        <a th:if="${productPage.hasPrevious()}" th:href="@{/products(
           keyword=${searchForm.keyword},
           categoryId=${searchForm.categoryId},
           minPrice=${searchForm.minPrice},
           maxPrice=${searchForm.maxPrice},
           inStockOnly=${searchForm.inStockOnly},
           sort=${searchForm.sort},
           page=${productPage.number - 1}
       )}" class="button button-secondary">
            前へ
        </a>

        <span th:each="pageNumber :
              ${#numbers.sequence(
                  0,
                  productPage.totalPages - 1)}">

            <span th:if="${pageNumber == productPage.number}" th:text="${pageNumber + 1}"
                class="button button-secondary">
            </span>

            <a th:unless="${pageNumber == productPage.number}" th:href="@{/products(
               keyword=${searchForm.keyword},
               categoryId=${searchForm.categoryId},
               minPrice=${searchForm.minPrice},
               maxPrice=${searchForm.maxPrice},
               inStockOnly=${searchForm.inStockOnly},
               sort=${searchForm.sort},
               page=${pageNumber}
           )}" th:text="${pageNumber + 1}" class="button button-secondary">
            </a>

        </span>

        <a th:if="${productPage.hasNext()}" th:href="@{/products(
           keyword=${searchForm.keyword},
           categoryId=${searchForm.categoryId},
           minPrice=${searchForm.minPrice},
           maxPrice=${searchForm.maxPrice},
           inStockOnly=${searchForm.inStockOnly},
           sort=${searchForm.sort},
           page=${productPage.number + 1}
       )}" class="button button-secondary">
            次へ
        </a>

    </div>

</body>

</html>
