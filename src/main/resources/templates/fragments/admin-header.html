<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <header th:fragment="header" class="site-header admin-header">

        <a th:href="@{/admin}" class="site-title">
            ECサイト管理
        </a>

        <nav class="site-nav">

            <a th:href="@{/admin}">
                管理TOP
            </a>

            <a th:href="@{/admin/products}">
                商品管理
            </a>

            <a th:href="@{/admin/categories}">
                カテゴリ管理
            </a>

            <a th:href="@{/admin/products/new}">
                商品登録
            </a>

            <a th:href="@{/admin/products/inactive}">
                非公開商品
            </a>

            <a th:href="@{/admin/orders}">
                注文管理
            </a>

            <a th:href="@{/admin/orders/action-required}">
                要対応注文一覧
            </a>

            <a th:href="@{/admin/order-status-histories}">
                注文ステータス変更履歴
            </a>

            <a th:href="@{/admin/order-handling-status-histories}">
                注文対応状況変更履歴
            </a>

            <a th:href="@{/admin/order-assignee-histories/list}">
                担当管理者変更履歴
            </a>

            <a th:href="@{/admin/sales}">
                売上ダッシュボード
            </a>

            <a th:href="@{/admin/accounts}">
                管理者アカウント
            </a>

            <span sec:authorize="isAuthenticated()" class="login-user">
                <span sec:authentication="name"></span>
                さん
            </span>

            <form th:action="@{/admin/logout}" method="post" class="inline-form">

                <button type="submit" class="button-secondary">
                    ログアウト
                </button>

            </form>

        </nav>

    </header>

</body>

</html>
