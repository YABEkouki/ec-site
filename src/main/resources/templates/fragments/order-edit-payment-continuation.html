<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<script th:fragment="automaticContinuation" th:if="${feature125AutoContinue == true}" th:attr="nonce=${paymentScriptNonce}">
(() => {
    const form = document.getElementById('payment-continue');
    if (!form) return;
    const message = document.getElementById('payment-continuation-status');
    const buttons = form.querySelectorAll('button[type="submit"]');
    let submitting = false;
    let automaticAttempted = false;
    const pending = () => {
        buttons.forEach(button => button.disabled = true);
        message.textContent = '認証結果を確認しています。注文変更はまだ完了していません。';
    };
    form.addEventListener('submit', event => {
        if (submitting) { event.preventDefault(); return; }
        submitting = true;
        pending();
    });
    window.orderEditPaymentContinue = () => {
        if (automaticAttempted || submitting) return;
        automaticAttempted = true;
        submitting = true;
        pending();
        try {
            // Navigate using the existing CSRF form. Only the server can establish completion.
            HTMLFormElement.prototype.submit.call(form);
        } catch (_) {
            submitting = false;
            buttons.forEach(button => button.disabled = false);
            message.textContent = '自動確認を開始できませんでした。ボタンからサーバーで結果を確認してください。';
        }
    };
})();
</script>
</body></html>
