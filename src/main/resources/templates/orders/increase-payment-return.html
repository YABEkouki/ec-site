<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<script th:attr="nonce=${paymentScriptNonce}">history.replaceState(null, '', window.location.pathname);</script>
<title>カード認証後の確認</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="flow-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="flow-main">
<h1>カード認証後の確認</h1>
<p class="flow-message-info">認証結果をサーバーで確認します。注文変更の完了はまだ確認できていません。</p>
<p th:if="${feature125AutoContinue == true}">自動確認が進まない場合は、下のボタンから保存済みの結果をご確認ください。カード認証は繰り返さないでください。</p>
<p th:unless="${feature125AutoContinue == true}">下のボタンからサーバーで結果を確認してください。カード認証は繰り返さないでください。</p>
<noscript><p>URLから一時的な認証情報を除去するためJavaScriptを有効にしてください。URLを共有しないでください。</p></noscript>
<form id="payment-continue" th:action="${paymentContinueUrl != null} ? @{${paymentContinueUrl}} : @{/orders/{id}/increase/{op}/payment/continue(id=${orderId},op=${operationId})}" method="post">
    <button type="submit" class="button-secondary">サーバーで確認して注文変更を続ける</button>
</form>
<p class="flow-message-info" id="payment-continuation-status" role="status" aria-live="polite"></p>
<th:block th:replace="~{fragments/order-edit-payment-continuation :: automaticContinuation}"></th:block>
<p class="actions"><a th:href="${paymentStatusUrl != null} ? @{${paymentStatusUrl}} : @{/orders/{id}/increase/{op}(id=${orderId},op=${operationId})}" class="button button-secondary">変更候補の状態を表示する</a></p>
<script th:if="${feature125AutoContinue == true}" th:attr="nonce=${paymentScriptNonce}">window.orderEditPaymentContinue();</script>
</main>
</body></html>
