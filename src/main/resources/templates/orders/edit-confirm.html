<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>注文変更内容の確認</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="flow-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="flow-main">
<h1>注文変更内容の確認</h1>
<p>変更期限（日本時間）：<strong th:text="${#temporals.format(preview.deadline, 'yyyy/MM/dd HH:mm')}"></strong></p>
<p>この画面は確認用です。注文・在庫・決済は変更されていません。</p>
<section class="flow-card"><h2>変更前の商品</h2>
<table><thead><tr><th>商品</th><th>単価（税込）</th><th>数量</th><th>小計（税込）</th><th>税率</th></tr></thead><tbody>
<tr th:each="item : ${preview.before.items}"><td th:text="${item.productName}"></td><td th:text="${item.unitPrice + '円'}"></td><td th:text="${item.quantity}"></td><td th:text="${item.subtotal + '円'}"></td><td th:text="${item.taxRateBasisPoints / 100.0 + '%'}"></td></tr>
</tbody></table></section>
<section class="flow-card"><h2>変更後の商品</h2>
<table><thead><tr><th>商品</th><th>単価（税込）</th><th>数量</th><th>小計（税込）</th><th>税率</th></tr></thead><tbody>
<tr th:each="item : ${preview.after.items}"><td th:text="${item.productName}"></td><td th:text="${item.unitPrice + '円'}"></td><td th:text="${item.quantity}"></td><td th:text="${item.subtotal + '円'}"></td><td th:text="${item.taxRateBasisPoints / 100.0 + '%'}"></td></tr>
</tbody></table></section>
<table><caption>金額の比較（税込）</caption><thead><tr><th>項目</th><th>変更前</th><th>変更後</th></tr></thead><tbody>
<tr><th>商品小計</th><td th:text="${preview.before.itemSubtotal + '円'}"></td><td th:text="${preview.after.itemSubtotal + '円'}"></td></tr>
<tr><th>送料</th><td th:text="${preview.before.chargeTotal + '円'}"></td><td th:text="${preview.after.chargeTotal + '円'}"></td></tr>
<tr><th>内税</th><td th:text="${preview.before.taxAmount + '円'}"></td><td th:text="${preview.after.taxAmount + '円'}"></td></tr>
<tr><th>注文合計</th><td th:text="${preview.before.totalAmount + '円'}"></td><td><strong th:text="${preview.after.totalAmount + '円'}"></strong></td></tr>
<tr><th>差額（変更後 − 変更前）</th><td colspan="2" th:text="${preview.after.totalAmount - preview.before.totalAmount + '円'}"></td></tr>
</tbody></table>
<p th:unless="${submissionAvailable}" class="message-error" role="alert">現在、注文変更の確定を利用できません。</p>
<form th:action="@{/orders/{id}/edit/submit(id=${orderId})}" method="post">
<input type="hidden" name="preview" th:value="${previewToken}">
<button type="submit" th:disabled="${!submissionAvailable}" class="button-primary">変更を確定する</button>
</form>
<p class="actions"><a th:href="@{/orders/{id}/edit(id=${orderId},preview=${previewToken})}" class="button button-secondary">編集画面へ戻る</a></p>
<p class="actions"><a th:href="@{/orders/{id}(id=${orderId})}" class="button button-secondary">注文詳細へ戻る</a></p>
</main>
</body></html>
