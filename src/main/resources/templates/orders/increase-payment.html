<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="referrer" content="no-referrer"><title>数量増加のカード認証</title></head>
<body>
<h1>変更後の注文全額をカードで与信する</h1>
<p>新旧の全額与信が一時的に重なります。デビット・プリペイドカードでは一時的な二重引落しや解放の遅れが生じることがあります。</p>
<p>新与信の成立と旧与信の取消を確認した後に注文を変更します。</p>
<div id="payment-form"></div>
<p id="payment-error" role="alert"></p>
<button type="button" id="payment-submit">このカードで認証する</button>
<form th:action="@{/orders/{id}/increase/{op}/payment/continue(id=${orderId},op=${operationId})}" method="post">
    <button type="submit">サーバーで結果を確認して続行する</button>
</form>
<p><a th:href="@{/orders/{id}/increase/{op}(id=${orderId},op=${operationId})}">変更候補の状態へ戻る</a></p>
<script src="https://js.pay.jp/payments.js" th:attr="nonce=${paymentScriptNonce}"></script>
<script th:inline="javascript" th:attr="nonce=${paymentScriptNonce}">
(() => {
    const payments = PayjpPayments(/*[[${card.publicKey}]]*/ '', {locale: 'ja'});
    const widgets = payments.widgets({clientSecret: /*[[${card.clientSecret}]]*/ ''});
    widgets.createForm('payment', {paymentMethodOrder: ['card']}).mount('#payment-form');
    const button = document.getElementById('payment-submit');
    const message = document.getElementById('payment-error');
    let attempted = false;
    button.addEventListener('click', async () => {
        if (attempted) return;
        attempted = true;
        button.disabled = true;
        try {
            // The official SDK performs required 3DS. The application never constructs a secret-bearing URL.
            await widgets.confirmPayment({return_url: /*[[${card.returnUrl}]]*/ ''});
        } catch (_) { /* Do not print SDK objects, credentials, URLs, or exception messages. */ }
        message.textContent = '認証結果をサーバーで確認してください。通信断後の再認証や別タブからの重複送信は行わないでください。';
        // Even SDK errors do not establish whether confirm reached the provider. Never automatically retry.
    });
})();
</script>
</body></html>
