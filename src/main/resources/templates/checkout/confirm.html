<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>注文確認</title>
</head>

<body>

<h1>注文確認</h1>

<table border="1">
    <thead>
    <tr>
        <th>商品名</th>
        <th>価格</th>
        <th>数量</th>
        <th>小計</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${cart.items}">
        <td th:text="${item.productName}"></td>
        <td th:text="${item.price}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${item.subtotal}"></td>
    </tr>
    </tbody>
</table>

<p>
    合計数量：
    <span th:text="${cart.totalQuantity}"></span>
</p>

<p>
    合計金額：
    <span th:text="${cart.totalAmount}"></span>
    円
</p>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"
   style="color: red;">
</p>

<form th:action="@{/checkout/order}" method="post">
    <button type="submit">注文を確定する</button>
</form>

<p>
    <a th:href="@{/cart}">カートへ戻る</a>
</p>

</body>
</html>
