<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>注文完了</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}">
    </header>

    <h1>注文完了</h1>

    <section class="completion-card">

        <h2>ご注文ありがとうございました。</h2>

        <p>
            注文を受け付けました。
        </p>

        <p>
            注文番号：
            <strong th:text="${orderId}"></strong>
        </p>

    </section>

    <div class="actions">

        <a th:href="@{/orders/{id}(
            id=${orderId})}" class="button button-primary">
            注文詳細を確認する
        </a>

        <a th:href="@{/orders}" class="button button-secondary">
            注文履歴を見る
        </a>

        <a th:href="@{/products}" class="button button-secondary">
            買い物を続ける
        </a>

    </div>
</body>

</html>
