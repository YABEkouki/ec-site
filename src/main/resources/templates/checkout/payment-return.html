<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<script th:attr="nonce=${paymentScriptNonce}">history.replaceState(null, '', window.location.pathname);</script>
<title>カード認証後の確認</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="flow-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="flow-main">
<h1>カード認証後の確認</h1>
<p class="flow-message-info">カード認証後の保存結果を確認します。注文の完了はまだ確認できていません。</p>
<p class="message-error" th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></p>
<p class="flow-message-warning" th:if="${!autoCheckAllowed}">自動確認は行いません。結果が不明な場合は、新しい注文やカード認証を繰り返さず、保存済みの注文をご確認ください。</p>
<noscript><p>一時的な認証情報をURLから除去するためJavaScriptを有効にしてください。URLを共有しないでください。</p></noscript>
<form id="checkout-continue" th:if="${confirmationTarget != null}" th:attr="data-key=${confirmationTarget.key()},data-auto=${autoCheckAllowed}" th:action="@{/checkout/payment/continue}" method="post">
<input type="hidden" name="expectedOrderId" th:value="${confirmationTarget.orderId}">
<input type="hidden" name="expectedPaymentId" th:value="${confirmationTarget.paymentId}">
<input type="hidden" name="expectedTransactionId" th:value="${confirmationTarget.transactionId}">
<button type="submit" class="button-secondary">サーバーで結果を確認する</button></form>
<p class="flow-message-info" id="checkout-confirmation-status" role="status" aria-live="polite"></p>
<noscript><p>自動確認は行いません。上のボタンで結果をご確認ください。</p></noscript>
<p th:if="${orderId != null}"><a th:href="@{/orders/{id}(id=${orderId})}">保存済みの注文を確認する</a></p>
<th:block th:replace="~{fragments/checkout-payment-continuation :: confirmation}"></th:block>
</main>
</body></html>
