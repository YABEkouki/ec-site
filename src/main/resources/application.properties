spring.application.name=ec-site

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ecsite
spring.datasource.username=ecuser
spring.datasource.password=ecpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=false

app.upload.product-image-dir=uploads/product-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

server.tomcat.max-swallow-size=12MB

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=no-reply@ec-site.local
app.base-url=http://localhost:8080
app.order.change-deadline-time=14:00

# PAY.JP
payjp.public-key=${PAYJP_PUBLIC_KEY:}
payjp.secret-key=${PAYJP_SECRET_KEY:}
payjp.api-base-url=https://api.pay.jp

payjp.webhook-token=${PAYJP_WEBHOOK_TOKEN:}

# Payment reconciliation
app.payment.reconciliation.enabled=true
app.payment.reconciliation.fixed-delay=1m
app.payment.reconciliation.pending-age=5m
app.payment.reconciliation.batch-size=100

app.payment.discrepancy-audit.enabled=true
app.payment.discrepancy-audit.fixed-delay=5m
app.payment.discrepancy-audit.batch-size=100

# Payment audit monitoring (read-only admin display)
app.payment.discrepancy-audit.monitoring.running-threshold=15m
app.payment.discrepancy-audit.monitoring.delay-grace=10m
app.payment.discrepancy-audit.monitoring.consecutive-failures=3
app.payment.discrepancy-audit.monitoring.long-unhandled-age=24h

# Payment audit notifications (disabled by default; dedicated scheduler and SMTP worker)
app.payment.discrepancy-audit.notification.enabled=${PAYMENT_AUDIT_NOTIFICATION_ENABLED:false}
app.payment.discrepancy-audit.notification.recipients=${PAYMENT_AUDIT_NOTIFICATION_RECIPIENTS:}
app.payment.discrepancy-audit.notification.fixed-delay=${PAYMENT_AUDIT_NOTIFICATION_FIXED_DELAY:1m}
app.payment.discrepancy-audit.notification.no-history-grace-period=${PAYMENT_AUDIT_NOTIFICATION_NO_HISTORY_GRACE_PERIOD:15m}
app.payment.discrepancy-audit.notification.retry-delay=${PAYMENT_AUDIT_NOTIFICATION_RETRY_DELAY:5m}
app.payment.discrepancy-audit.notification.max-attempts=${PAYMENT_AUDIT_NOTIFICATION_MAX_ATTEMPTS:3}
app.payment.discrepancy-audit.notification.claim-lease=${PAYMENT_AUDIT_NOTIFICATION_CLAIM_LEASE:3m}
app.payment.discrepancy-audit.notification.smtp.connection-timeout=${PAYMENT_AUDIT_NOTIFICATION_SMTP_CONNECTION_TIMEOUT:5s}
app.payment.discrepancy-audit.notification.smtp.read-timeout=${PAYMENT_AUDIT_NOTIFICATION_SMTP_READ_TIMEOUT:10s}
app.payment.discrepancy-audit.notification.smtp.write-timeout=${PAYMENT_AUDIT_NOTIFICATION_SMTP_WRITE_TIMEOUT:10s}
app.payment.discrepancy-audit.notification.smtp.send-deadline=${PAYMENT_AUDIT_NOTIFICATION_SMTP_SEND_DEADLINE:2m}
