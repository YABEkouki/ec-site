spring.application.name=ec-site

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ecsite
spring.datasource.username=ecuser
spring.datasource.password=ecpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=false

app.upload.product-image-dir=uploads/product-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

server.tomcat.max-swallow-size=12MB

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=no-reply@ec-site.local
app.base-url=http://localhost:8080
app.order.change-deadline-time=14:00

# PAY.JP
payjp.public-key=${PAYJP_PUBLIC_KEY:}
payjp.secret-key=${PAYJP_SECRET_KEY:}
payjp.api-base-url=https://api.pay.jp

payjp.webhook-token=${PAYJP_WEBHOOK_TOKEN:}

# Payment reconciliation
app.payment.reconciliation.enabled=true
app.payment.reconciliation.fixed-delay=1m
app.payment.reconciliation.pending-age=5m
app.payment.reconciliation.batch-size=100

# Feature130-A: administrator hold list. Automatically progressing holds older than this are shown as stalled.
app.order-hold.stale-after=${ORDER_HOLD_STALE_AFTER:30m}

# Feature131: 14:05 warehouse export with automatic shipping preparation (disabled by default).
# Orders whose change deadline is before the start date (yyyy-MM-dd) are never exported automatically.
app.warehouse-export.enabled=${WAREHOUSE_EXPORT_ENABLED:false}
app.warehouse-export.start-date=${WAREHOUSE_EXPORT_START_DATE:}
app.warehouse-export.fixed-delay=${WAREHOUSE_EXPORT_FIXED_DELAY:1m}
app.warehouse-export.page-size=100
# Feature137-B: write the warehouse files (header + detail) to the folder collected by FTP (disabled by default).
# Outputs are recorded even while disabled. The work folder must be on the same file system as the output folder
# and outside it (temporary files are moved atomically into the output folder).
app.warehouse-file.enabled=${WAREHOUSE_FILE_ENABLED:false}
app.warehouse-file.output-dir=${WAREHOUSE_FILE_OUTPUT_DIR:}
app.warehouse-file.work-dir=${WAREHOUSE_FILE_WORK_DIR:}
app.warehouse-file.fixed-delay=${WAREHOUSE_FILE_FIXED_DELAY:1m}
app.warehouse-file.retry-delay=5m
app.warehouse-file.max-attempts=12
# Feature132: background shipment of the orders listed in uploaded shipped CSV files (disabled by default).
app.warehouse-shipment-import.enabled=${WAREHOUSE_SHIPMENT_IMPORT_ENABLED:false}
app.warehouse-shipment-import.fixed-delay=${WAREHOUSE_SHIPMENT_IMPORT_FIXED_DELAY:1m}
app.warehouse-shipment-import.max-attempts=3
app.warehouse-shipment-import.page-size=50

# Feature135-B3: replace ESTIMATED authorization expiries with PAY.JP expired_at by read-only GET (disabled by default).
app.payment.authorization-expiry-refresh.enabled=${AUTHORIZATION_EXPIRY_REFRESH_ENABLED:false}
app.payment.authorization-expiry-refresh.fixed-delay=${AUTHORIZATION_EXPIRY_REFRESH_FIXED_DELAY:10m}
app.payment.authorization-expiry-refresh.batch-size=20
app.payment.authorization-expiry-refresh.retry-after=6h

app.payment.discrepancy-audit.enabled=true
app.payment.discrepancy-audit.fixed-delay=5m
app.payment.discrepancy-audit.batch-size=100

# Payment audit monitoring (read-only admin display)
app.payment.discrepancy-audit.monitoring.running-threshold=15m
app.payment.discrepancy-audit.monitoring.delay-grace=10m
app.payment.discrepancy-audit.monitoring.consecutive-failures=3
app.payment.discrepancy-audit.monitoring.long-unhandled-age=24h

# Payment audit notifications (disabled by default; dedicated scheduler and SMTP worker)
app.payment.discrepancy-audit.notification.enabled=${PAYMENT_AUDIT_NOTIFICATION_ENABLED:false}
app.payment.discrepancy-audit.notification.recipients=${PAYMENT_AUDIT_NOTIFICATION_RECIPIENTS:}
app.payment.discrepancy-audit.notification.fixed-delay=${PAYMENT_AUDIT_NOTIFICATION_FIXED_DELAY:1m}
app.payment.discrepancy-audit.notification.no-history-grace-period=${PAYMENT_AUDIT_NOTIFICATION_NO_HISTORY_GRACE_PERIOD:15m}
app.payment.discrepancy-audit.notification.retry-delay=${PAYMENT_AUDIT_NOTIFICATION_RETRY_DELAY:5m}
app.payment.discrepancy-audit.notification.max-attempts=${PAYMENT_AUDIT_NOTIFICATION_MAX_ATTEMPTS:3}
app.payment.discrepancy-audit.notification.claim-lease=${PAYMENT_AUDIT_NOTIFICATION_CLAIM_LEASE:3m}
app.payment.discrepancy-audit.notification.smtp.connection-timeout=${PAYMENT_AUDIT_NOTIFICATION_SMTP_CONNECTION_TIMEOUT:5s}
app.payment.discrepancy-audit.notification.smtp.read-timeout=${PAYMENT_AUDIT_NOTIFICATION_SMTP_READ_TIMEOUT:10s}
app.payment.discrepancy-audit.notification.smtp.write-timeout=${PAYMENT_AUDIT_NOTIFICATION_SMTP_WRITE_TIMEOUT:10s}
app.payment.discrepancy-audit.notification.smtp.send-deadline=${PAYMENT_AUDIT_NOTIFICATION_SMTP_SEND_DEADLINE:2m}

# Conservative application POST window; not PAY.JP's retention guarantee.
payjp.safety.connect-timeout=5s
payjp.safety.read-timeout=15s
payjp.safety.post-max-age=23h

# Never include the query string, full request line or Referer in the embedded connector access log.
server.tomcat.accesslog.pattern=%h %l %u %t "%m %U %H" %s %b
spring.mvc.log-request-details=false

# Stop both manual resend delivery and expired-operation recovery (default preserves existing behavior).
app.payment.discrepancy-audit.notification.manual-resend-scheduler-enabled=true
# Feature133: customer order notification mails (disabled by default). Events are always recorded (V91);
# only enabling sends them, and records older than max-age then expire instead of being sent.
app.customer-notification.enabled=${CUSTOMER_NOTIFICATION_ENABLED:false}
app.customer-notification.fixed-delay=${CUSTOMER_NOTIFICATION_FIXED_DELAY:30s}
app.customer-notification.max-age=${CUSTOMER_NOTIFICATION_MAX_AGE:24h}
