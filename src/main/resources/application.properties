spring.application.name=ec-site

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ecsite
spring.datasource.username=ecuser
spring.datasource.password=ecpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=false

app.upload.product-image-dir=uploads/product-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

server.tomcat.max-swallow-size=12MB

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=no-reply@ec-site.local
app.base-url=http://localhost:8080
