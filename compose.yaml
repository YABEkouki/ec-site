services:
  postgres:
    image: postgres:17
    container_name: ec-site-postgres
    environment:
      POSTGRES_DB: ecsite
      POSTGRES_USER: ecuser
      POSTGRES_PASSWORD: ecpassword
    ports:
      - "5432:5432"
    volumes:
      - ec-site-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecuser -d ecsite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ec-site-postgres-data:
